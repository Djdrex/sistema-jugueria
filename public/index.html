function verDashboard(){
  document.getElementById("contenido").innerHTML = 
  "<h3>Dashboard</h3>" +

  "<div id='stats'></div>" +

  "<h4>Productos más vendidos</h4>" +
  "<div id='topProductos'></div>";

  cargarDashboard();
}

async function cargarDashboard(){

  const res = await fetch("/pedidos");
  const pedidos = await res.json();

  let totalVentas = 0;
  let pedidosHoy = 0;

  let productos = {};

  const hoy = new Date().toDateString();

  pedidos.forEach(p=>{

    if(p.estado === "entregado" && p.pagado){
  totalVentas += p.total;

      const fechaPedido = new Date(p.fecha);
      if(!isNaN(fechaPedido) && fechaPedido.toDateString() === hoy){
      pedidosHoy++;
      }
      p.items.forEach(i=>{
        if(!productos[i.producto]){
          productos[i.producto] = 0;
        }
        productos[i.producto]++;
      });
    }

  });

  // 🔥 TOP PRODUCTOS
  const top = Object.entries(productos)
    .sort((a,b)=>b[1]-a[1])
    .slice(0,5);

  // 📊 STATS
  document.getElementById("stats").innerHTML =
    "💰 Ventas totales: S/" + totalVentas + "<br>" +
    "📦 Pedidos hoy: " + pedidosHoy + "<br>";

  // 🧃 TOP PRODUCTOS
  const cont = document.getElementById("topProductos");
  cont.innerHTML = "";

  top.forEach(p=>{
    cont.innerHTML += p[0] + " (" + p[1] + ")<br>";
  });

}

async function resetSistema(){

  const confirmacion = prompt("Escribe CONFIRMAR para reiniciar");

  if(confirmacion !== "CONFIRMAR"){
    alert("Cancelado");
    return;
  }

  await fetch("/reset",{
    method:"DELETE",
    headers:{
      "Authorization":token,
      "Content-Type":"application/json"
    },
    body: JSON.stringify({ confirmacion })
  });

  alert("✅ Sistema reiniciado");
  socket.emit("actualizar_manual");
}


// ENVIAR
async function enviarPedido(){

  try{

    if(pedidoActual.length === 0){
      alert("Agrega productos");
      return;
    }

    const mesa = document.getElementById("mesa").value;

    if(!mesa){
      alert("Ingresa una mesa");
      return;
    }

    const btn = document.querySelector("button[onclick='enviarPedido()']");
    btn.disabled = true;
    btn.innerText = "Enviando...";

    const res = await fetch("/pedidos",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":token
      },
      body:JSON.stringify({
        mesa,
        items:pedidoActual
      })
    });

    const data = await res.json();

    if(data.error){
      alert("❌ " + data.error);
      btn.disabled = false;
      btn.innerText = "Enviar Pedido";
      return;
    }

    alert("✅ Pedido enviado");

    pedidoActual = [];

    renderPreview();

    document.getElementById("mesa").value = "";
    document.getElementById("buscador").value = "";
    document.getElementById("resultados").innerHTML = "";

    socket.emit("actualizar_manual");

    btn.disabled = false;
    btn.innerText = "Enviar Pedido";

  }catch(err){

    console.error(err);

    alert("❌ Error enviando pedido");

    const btn = document.querySelector("button[onclick='enviarPedido()']");

    if(btn){
      btn.disabled = false;
      btn.innerText = "Enviar Pedido";
    }
  }
}

// BARRA




async function cargarPedidosMesero(){

  const res = await fetch("/pedidos");
  const data = await res.json();

  const cont = document.getElementById("listaCobros");
  cont.innerHTML = "";

  data.forEach(p => {

    // 🔥 SOLO PEDIDOS ENTREGADOS Y NO PAGADOS
    if(p.estado !== "entregado" || p.pagado) return;

    const div = document.createElement("div");
    div.style.border = "1px solid white";
    div.style.margin = "5px";
    div.style.padding = "10px";

    let html = "<b>Mesa " + p.mesa + "</b><br>";
    html += "Total: S/" + p.total + "<br><br>";

    p.items.forEach(i => {
      html += "- " + i.producto + "<br>";
    });

    div.innerHTML = html;

    const btn = document.createElement("button");
    btn.innerText = "💰 Cobrar";
    btn.onclick = () => cobrarPedido(p._id, p);

    div.appendChild(btn);

    cont.appendChild(div);
  });

}

async function cobrarPedido(id, pedido){ 

  let html = `
    <h3>💰 Cobrar Pedido</h3>
    <b>Mesa ${pedido.mesa}</b><br><br>

    <button onclick="seleccionarTodo()">✅ Seleccionar todo</button>
    <button onclick="deseleccionarTodo()">❌ Limpiar</button>

    <h4>Selecciona productos</h4>
  `;

  let pagado = pedido.totalPagado || 0;

  html += `<p>💰 Ya pagado: S/ ${pagado}</p>`;
  html += `<p>🧾 Restante: S/ ${(pedido.total - pagado).toFixed(2)}</p><br>`;
  html += "<h4>💰 Pagos realizados</h4>";

if(pedido.pagos && pedido.pagos.length > 0){

  pedido.pagos.forEach(p => {

    html += `
      <div style="
        border:1px solid gray;
        padding:5px;
        margin-bottom:5px;
        border-radius:5px;
      ">

        Método: ${p.metodo}<br>
        Monto: S/${Number(p.monto).toFixed(2)}<br>

        ${p.recibido ? `
          Recibido: S/${Number(p.recibido).toFixed(2)}<br>
          Vuelto: S/${Number(p.vuelto).toFixed(2)}<br>
        ` : ""}

        Mesero: ${p.mesero || "Desconocido"}

      </div>
    `;

  });

}else{

  html += "<p>No hay pagos registrados</p>";

}

  pedido.items.forEach((item, index) => {

  // 🔥 SI YA ESTÁ PAGADO
  if(item.pagado){

    html += `
      <div style="opacity:0.5;color:lightgreen">
        ✅ ${item.producto} - PAGADO
      </div>
    `;

    return;
  }
      html += `
    <input 
      type="checkbox" 
      class="itemCheck" 
      data-index="${index}"
      data-precio="${item.precio}"
    >
    ${item.producto} - S/${Number(item.precio).toFixed(2)}
    <br>
  `;
    });

  html += `
    <br>
    <button onclick="calcularTotalSeleccionado('${id}')">Calcular total</button>

    <div id="totalSeleccionado"></div>
  `;
   

  document.getElementById("contenido").innerHTML = html;
}

function seleccionarTodo(){
  document.querySelectorAll(".itemCheck").forEach(c => c.checked = true);
}

function deseleccionarTodo(){
  document.querySelectorAll(".itemCheck").forEach(c => c.checked = false);
}

function calcularTotalSeleccionado(id){

  const checks = document.querySelectorAll(".itemCheck");

  let total = 0;
  let indicesSeleccionados = [];

  checks.forEach(c => {

  if(c.checked){

    total += Number(c.dataset.precio);

    indicesSeleccionados.push(
      Number(c.dataset.index)
    );
  }
});

  if(total === 0){
    alert("Selecciona al menos un producto");
    return;
  }

  fetch("/pedidos")
    .then(res => res.json())
    .then(data => {

      const pedido = data.find(p => p._id === id);

      const pagado = Number(pedido.totalPagado || 0);
      const restante = Number(pedido.total) - pagado;

      if(total > restante){
      total = restante; 
      total = Number(total.toFixed(2));
       alert("El total seleccionado excede el restante. Se ajustará a S/ " + total);
     }
      
      total = Number(total.toFixed(2));

      document.getElementById("totalSeleccionado").innerHTML = `
        <h4>Total: S/ ${total}</h4>

        <button onclick='seleccionarMetodo(
  "yape",
  "${id}",
  ${total},
  ${JSON.stringify(indicesSeleccionados)}
)'>Yape</button>

<button onclick='seleccionarMetodo(
  "efectivo",
  "${id}",
  ${total},
  ${JSON.stringify(indicesSeleccionados)}
)'>Efectivo</button>
      `;
    });
}

function seleccionarMetodo(metodo, id, total, indices){

  const zona = document.getElementById("totalSeleccionado");

  if(!zona){
    alert("Error en interfaz de pago");
    return;
  }

  if(metodo === "yape"){
    zona.innerHTML = `
      <p>Pago con Yape por S/ ${total}</p>
      <button id="btnConfirmarPago"
onclick="confirmarPago(
  '${id}',
  ${total},
  'yape',
  null,
  ${JSON.stringify(indices)}
)">
Confirmar
</button>
    `;
  }

  if(metodo === "efectivo"){
    zona.innerHTML = `
      <p>Total: S/ ${total}</p>
      Recibido: <input id="recibido" type="number"><br><br>
      <button onclick="calcularVuelto('${id}', ${total}, ${JSON.stringify(indices)})">Calcular vuelto</button>
      <div id="resultadoVuelto"></div>
    `;
  }
}

function calcularVuelto(id, total, indices){

  const input = document.getElementById("recibido");

  if(!input){
    alert("Error: no se encontró el campo de pago");
    return;
  }

  const recibido = parseFloat(input.value);

  if(isNaN(recibido)){
    alert("Ingresa un monto válido");
    return;
  }

  if(recibido < total){
    alert("Monto insuficiente");
    return;
  }

  const vuelto = (recibido - total).toFixed(2);

  document.getElementById("resultadoVuelto").innerHTML = `
    Vuelto: S/ ${vuelto} <br><br>
    <button id="btnConfirmarPago"
onclick="confirmarPago(
  '${id}',
  ${total},
  'efectivo',
  ${recibido},
  ${JSON.stringify(indices)}
)">
Confirmar pago
</button>
  `;
}

async function confirmarPago(id, monto, metodo, recibido, indices){
  
  const btn = document.getElementById("btnConfirmarPago");

if(btn){
  btn.disabled = true;
  btn.innerText = "Procesando...";
}

  const res = await fetch("/pedidos/" + id + "/pagar",{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "Authorization":token
    },
    body:JSON.stringify({
  monto:Number(monto),
  metodo,
  recibido,
  indices
})
  });

  const data = await res.json();

  if(data.error){
    if(btn){
  btn.disabled = false;
  btn.innerText = "Confirmar";
}
    alert("❌ " + data.error);
  } else {
    alert("✅ Pago registrado");
  }

  socket.emit("actualizar_manual");
  verPedidos();
}

function dividirCuenta(id, total){

  const personas = Number(document.getElementById("personas").value);

  if(!personas || personas <= 0){
    alert("Número inválido");
    return;
  }

  const porPersona = (total / personas).toFixed(2);

  let html = "<h4>Cada persona paga: S/ " + porPersona + "</h4>";

  for(let i=0; i<personas; i++){
    html += `
      Persona ${i+1} 
      <button onclick="confirmarPago('${id}', ${porPersona}, 'yape', null)">Yape</button>
      <button onclick="pagoEfectivoSeparado('${id}', ${porPersona})">Efectivo</button>
      <br><br>
    `;
  }

  document.getElementById("zonaPago").innerHTML = html;
}

function pagoEfectivoSeparado(id, monto){

  const recibido = prompt("Monto recibido:");

  if(!recibido || Number(recibido) < monto){
    alert("Monto insuficiente");
    return;
  }

  confirmarPago(id, monto, "efectivo", Number(recibido));
}

// USUARIOS
function verUsuarios(){
  document.getElementById("contenido").innerHTML =
  "<h3>Panel de Usuarios</h3>" +

  "Usuario <input id='u'><br>" +
  "Contraseña <input id='p'><br>" +
  "Rol <select id='r'>" +
  "<option value='mesero'>Mesero</option>" +
  "<option value='barra'>Barra</option>" +
  "<option value='admin'>Admin</option>" +
  "</select><br>" +

  "<button onclick='crearUsuario()'>Crear Usuario</button><br><br>" +

  "<h4>Lista de usuarios</h4>" +
  "<div id='listaUsuarios'></div>";

  cargarUsuarios();
}

async function crearUsuario(){
  await fetch("/usuarios",{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "Authorization":token
    },
    body:JSON.stringify({
      username:document.getElementById("u").value,
      password:document.getElementById("p").value,
      rol:document.getElementById("r").value
    })
  });
  await cargarUsuarios();

  document.getElementById("u").value = "";
  document.getElementById("p").value = "";
}

async function cargarUsuarios(){
  const res = await fetch("/usuarios",{
    headers:{ "Authorization":token }
  });

  const data = await res.json();

  const cont = document.getElementById("listaUsuarios");
  cont.innerHTML="";

  data.forEach(u=>{

    const div = document.createElement("div");

    let etiqueta = u.username + " (" + u.rol + ")";

    if(u.username === "admin@titan02"){
      etiqueta += " 🔥 ADMIN PRINCIPAL";
    }

    div.innerText = etiqueta + " ";

    // 🔴 ELIMINAR
    if(u.username !== "admin@titan02"){
      const btnDel = document.createElement("button");
      btnDel.innerText = "❌";
      btnDel.onclick = () => eliminarUsuario(u._id);
      div.appendChild(btnDel);
    }

    // 🔄 CAMBIAR ROL
    if(u.username !== "admin@titan02"){
      const select = document.createElement("select");

      ["mesero","barra","admin"].forEach(r=>{
        const op = document.createElement("option");
        op.value = r;
        op.innerText = r;
        if(r === u.rol) op.selected = true;
        select.appendChild(op);
      });

      select.onchange = () => cambiarRol(u._id, select.value);
      div.appendChild(select);
    }

    // 🔑 CAMBIAR PASSWORD
    const btnPass = document.createElement("button");
    btnPass.innerText = "🔑";
    btnPass.onclick = () => cambiarPasswordAdmin(u._id);
    div.appendChild(btnPass);

    cont.appendChild(div);
  });
}

// CAMBIAR ROL
async function cambiarRol(id, rol){
  await fetch("/usuarios/"+id+"/rol",{
    method:"PUT",
    headers:{
      "Content-Type":"application/json",
      "Authorization":token
    },
    body:JSON.stringify({rol})
  });

  cargarUsuarios();
}

// CAMBIAR PASSWORD (ADMIN)
async function cambiarPasswordAdmin(id){
  const nueva = prompt("Nueva contraseña:");

  if(!nueva) return;

  await fetch("/usuarios/"+id+"/password",{
    method:"PUT",
    headers:{
      "Content-Type":"application/json",
      "Authorization":token
    },
    body:JSON.stringify({nueva})
  });

  alert("✅ Contraseña actualizada");
}

async function eliminarUsuario(id){
  await fetch("/usuarios/"+id,{
    method:"DELETE",
    headers:{ "Authorization":token }
  });
}

// INFORMES
function verInformes(){
  document.getElementById("contenido").innerHTML =
  "<h3>Reportes</h3>" +

  "Desde <input type='date' id='desde'><br>" +
  "Hasta <input type='date' id='hasta'><br><br>" +

  "<button onclick='generarReporte()'>Generar</button>" +

  "<div id='resultadoReporte'></div>";
}

async function verActividad(){

  document.getElementById("contenido").innerHTML =
    "<h3>Actividad del sistema</h3>" +
    "<div id='listaActividad'></div>";

  const res = await fetch("/actividad",{
    headers:{
      "Authorization":token
    }
  });

  const data = await res.json();

  const cont = document.getElementById("listaActividad");

  data.forEach(a=>{

    cont.innerHTML += `
      <div style="
        border:1px solid gray;
        padding:8px;
        margin:5px;
        border-radius:5px;
      ">

        <b>${a.usuario}</b><br>

        Acción: ${a.accion}<br>

        ${a.detalle}<br>

        <small>
          ${new Date(a.fecha).toLocaleString()}
        </small>

      </div>
    `;

  });

}

async function generarReporte(){

  const desde = document.getElementById("desde").value;
  const hasta = document.getElementById("hasta").value;

  let url = "/reporte";

  if(desde && hasta){
    url += "?desde=" + desde + "&hasta=" + hasta;
  }

  const res = await fetch(url,{
    headers:{ "Authorization":token }
  });

  const data = await res.json();

  let html =
  "💰 Total vendido: S/" + data.total + "<br>" +
  "📦 Pedidos: " + data.cantidad + "<br><br>";

  data.pedidos.forEach(p=>{
    html += "🪑 Mesa " + p.mesa +
            " | S/" + p.total +
            " | " + new Date(p.fecha).toLocaleString() +
            "<br>";
  });

  document.getElementById("resultadoReporte").innerHTML = html;
}

async function cargarInformes(){
  const res = await fetch("/pedidos");
  const data = await res.json();

  const cont = document.getElementById("listaInf");
  cont.innerHTML="";

  data.forEach(p=>{
    if(p.estado==="entregado"){
      // Creamos un contenedor para la fila
      const div = document.createElement("div");
      div.innerText = "Mesa " + p.mesa + " S/" + p.total + " ";
      
      // Creamos el botón "sin errores"
      const btn = document.createElement("button");
      btn.innerText = "❌";
      btn.onclick = () => eliminarPedido(p._id);
      
      // Agregamos el botón al div, y el div al contenedor principal
      div.appendChild(btn);
      cont.appendChild(div);
    }
  });
}

async function eliminarPedido(id){
  await fetch("/pedidos/"+id,{
    method:"DELETE",
    headers:{ "Authorization":token }
  });
  socket.emit("actualizar_manual");
  await cargarInformes();
}


 
// 🔄 ACTUALIZACIONES EN TIEMPO REAL
socket.on("actualizar",()=>{

  if(document.getElementById("lista")) cargarPedidos();

  if(document.getElementById("listaProd")) cargarProductos();

  if(document.getElementById("listaInf")) cargarInformes();

  if(document.getElementById("stats")) cargarDashboard();

  if(document.getElementById("listaCobros")) cargarPedidosMesero();

  if(document.getElementById("panelNoti").style.display === "block"){
  cargarNotificaciones();
}
});


setInterval(()=>{
  if(document.getElementById("lista")){
    cargarPedidos();
  }
}, 6000);

</script>
