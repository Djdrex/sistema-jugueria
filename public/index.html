<!DOCTYPE html>
<html>
<head>
<title>Sistema PRO</title>
<script src="/socket.io/socket.io.js"></script>
</head>

<body style="background:#111;color:white;font-family:Arial">

<div id="loginDiv">
  <h2>Login</h2>
  <input id="user"><br><br>
  <input id="pass" type="password"><br><br>
  <button onclick="login()">Entrar</button>
</div>

<div id="app" style="display:none">
  <h2 id="info"></h2>
  <div id="tabs"></div>
  <div id="contenido"></div>
</div>

<div style="position:absolute; top:10px; right:20px;">
  <button onclick="toggleNotificaciones()">
    🔔 <span id="contadorNoti"></span>
  </button>
</div>

<div id="panelNoti" style="
  position:fixed;
  right:0;
  top:0;
  width:300px;
  height:100%;
  background:#222;
  display:none;
  overflow-y:auto;
  padding:10px;
">

</div>

<script>

// 


// 
// DASHBOARD
// 
function verDashboard(){
  document.getElementById("contenido").innerHTML = 
  "<h3>Dashboard</h3>" +

  "<div id='stats'></div>" +

  "<h4>Productos más vendidos</h4>" +
  "<div id='topProductos'></div>";

  cargarDashboard();
}

async function cargarDashboard(){

  const res = await fetch("/pedidos");
  const pedidos = await res.json();

  let totalVentas = 0;
  let pedidosHoy = 0;

  let productos = {};

  const hoy = new Date().toDateString();

  pedidos.forEach(p=>{

    if(p.estado === "entregado" && p.pagado){
  totalVentas += p.total;

      const fechaPedido = new Date(p.fecha);
      if(!isNaN(fechaPedido) && fechaPedido.toDateString() === hoy){
      pedidosHoy++;
      }
      p.items.forEach(i=>{
        if(!productos[i.producto]){
          productos[i.producto] = 0;
        }
        productos[i.producto]++;
      });
    }

  });

  // 🔥 TOP PRODUCTOS
  const top = Object.entries(productos)
    .sort((a,b)=>b[1]-a[1])
    .slice(0,5);

  // 📊 STATS
  document.getElementById("stats").innerHTML =
    "💰 Ventas totales: S/" + totalVentas + "<br>" +
    "📦 Pedidos hoy: " + pedidosHoy + "<br>";

  // 🧃 TOP PRODUCTOS
  const cont = document.getElementById("topProductos");
  cont.innerHTML = "";

  top.forEach(p=>{
    cont.innerHTML += p[0] + " (" + p[1] + ")<br>";
  });

}

async function resetSistema(){

  const confirmacion = prompt("Escribe CONFIRMAR para reiniciar");

  if(confirmacion !== "CONFIRMAR"){
    alert("Cancelado");
    return;
  }

  await fetch("/reset",{
    method:"DELETE",
    headers:{
      "Authorization":token,
      "Content-Type":"application/json"
    },
    body: JSON.stringify({ confirmacion })
  });

  alert("✅ Sistema reiniciado");
  socket.emit("actualizar_manual");
}


// USUARIOS
function verUsuarios(){
  document.getElementById("contenido").innerHTML =
  "<h3>Panel de Usuarios</h3>" +

  "Usuario <input id='u'><br>" +
  "Contraseña <input id='p'><br>" +
  "Rol <select id='r'>" +
  "<option value='mesero'>Mesero</option>" +
  "<option value='barra'>Barra</option>" +
  "<option value='admin'>Admin</option>" +
  "</select><br>" +

  "<button onclick='crearUsuario()'>Crear Usuario</button><br><br>" +

  "<h4>Lista de usuarios</h4>" +
  "<div id='listaUsuarios'></div>";

  cargarUsuarios();
}

async function crearUsuario(){
  await fetch("/usuarios",{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "Authorization":token
    },
    body:JSON.stringify({
      username:document.getElementById("u").value,
      password:document.getElementById("p").value,
      rol:document.getElementById("r").value
    })
  });
  await cargarUsuarios();

  document.getElementById("u").value = "";
  document.getElementById("p").value = "";
}

async function cargarUsuarios(){
  const res = await fetch("/usuarios",{
    headers:{ "Authorization":token }
  });

  const data = await res.json();

  const cont = document.getElementById("listaUsuarios");
  cont.innerHTML="";

  data.forEach(u=>{

    const div = document.createElement("div");

    let etiqueta = u.username + " (" + u.rol + ")";

    if(u.username === "admin@titan02"){
      etiqueta += " 🔥 ADMIN PRINCIPAL";
    }

    div.innerText = etiqueta + " ";

    // 🔴 ELIMINAR
    if(u.username !== "admin@titan02"){
      const btnDel = document.createElement("button");
      btnDel.innerText = "❌";
      btnDel.onclick = () => eliminarUsuario(u._id);
      div.appendChild(btnDel);
    }

    // 🔄 CAMBIAR ROL
    if(u.username !== "admin@titan02"){
      const select = document.createElement("select");

      ["mesero","barra","admin"].forEach(r=>{
        const op = document.createElement("option");
        op.value = r;
        op.innerText = r;
        if(r === u.rol) op.selected = true;
        select.appendChild(op);
      });

      select.onchange = () => cambiarRol(u._id, select.value);
      div.appendChild(select);
    }

    // 🔑 CAMBIAR PASSWORD
    const btnPass = document.createElement("button");
    btnPass.innerText = "🔑";
    btnPass.onclick = () => cambiarPasswordAdmin(u._id);
    div.appendChild(btnPass);

    cont.appendChild(div);
  });
}

// CAMBIAR ROL
async function cambiarRol(id, rol){
  await fetch("/usuarios/"+id+"/rol",{
    method:"PUT",
    headers:{
      "Content-Type":"application/json",
      "Authorization":token
    },
    body:JSON.stringify({rol})
  });

  cargarUsuarios();
}

// CAMBIAR PASSWORD (ADMIN)
async function cambiarPasswordAdmin(id){
  const nueva = prompt("Nueva contraseña:");

  if(!nueva) return;

  await fetch("/usuarios/"+id+"/password",{
    method:"PUT",
    headers:{
      "Content-Type":"application/json",
      "Authorization":token
    },
    body:JSON.stringify({nueva})
  });

  alert("✅ Contraseña actualizada");
}

async function eliminarUsuario(id){
  await fetch("/usuarios/"+id,{
    method:"DELETE",
    headers:{ "Authorization":token }
  });
}

// INFORMES
function verInformes(){
  document.getElementById("contenido").innerHTML =
  "<h3>Reportes</h3>" +

  "Desde <input type='date' id='desde'><br>" +
  "Hasta <input type='date' id='hasta'><br><br>" +

  "<button onclick='generarReporte()'>Generar</button>" +

  "<div id='resultadoReporte'></div>";
}

async function verActividad(){

  document.getElementById("contenido").innerHTML =
    "<h3>Actividad del sistema</h3>" +
    "<div id='listaActividad'></div>";

  const res = await fetch("/actividad",{
    headers:{
      "Authorization":token
    }
  });

  const data = await res.json();

  const cont = document.getElementById("listaActividad");

  data.forEach(a=>{

    cont.innerHTML += `
      <div style="
        border:1px solid gray;
        padding:8px;
        margin:5px;
        border-radius:5px;
      ">

        <b>${a.usuario}</b><br>

        Acción: ${a.accion}<br>

        ${a.detalle}<br>

        <small>
          ${new Date(a.fecha).toLocaleString()}
        </small>

      </div>
    `;

  });

}

async function generarReporte(){

  const desde = document.getElementById("desde").value;
  const hasta = document.getElementById("hasta").value;

  let url = "/reporte";

  if(desde && hasta){
    url += "?desde=" + desde + "&hasta=" + hasta;
  }

  const res = await fetch(url,{
    headers:{ "Authorization":token }
  });

  const data = await res.json();

  let html =
  "💰 Total vendido: S/" + data.total + "<br>" +
  "📦 Pedidos: " + data.cantidad + "<br><br>";

  data.pedidos.forEach(p=>{
    html += "🪑 Mesa " + p.mesa +
            " | S/" + p.total +
            " | " + new Date(p.fecha).toLocaleString() +
            "<br>";
  });

  document.getElementById("resultadoReporte").innerHTML = html;
}

async function cargarInformes(){
  const res = await fetch("/pedidos");
  const data = await res.json();

  const cont = document.getElementById("listaInf");
  cont.innerHTML="";

  data.forEach(p=>{
    if(p.estado==="entregado"){
      // Creamos un contenedor para la fila
      const div = document.createElement("div");
      div.innerText = "Mesa " + p.mesa + " S/" + p.total + " ";
      
      // Creamos el botón "sin errores"
      const btn = document.createElement("button");
      btn.innerText = "❌";
      btn.onclick = () => eliminarPedido(p._id);
      
      // Agregamos el botón al div, y el div al contenedor principal
      div.appendChild(btn);
      cont.appendChild(div);
    }
  });
}

async function eliminarPedido(id){
  await fetch("/pedidos/"+id,{
    method:"DELETE",
    headers:{ "Authorization":token }
  });
  socket.emit("actualizar_manual");
  await cargarInformes();
}


 
// 🔄 ACTUALIZACIONES EN TIEMPO REAL
socket.on("actualizar",()=>{

  if(document.getElementById("lista")) cargarPedidos();

  if(document.getElementById("listaProd")) cargarProductos();

  if(document.getElementById("listaInf")) cargarInformes();

  if(document.getElementById("stats")) cargarDashboard();

  if(document.getElementById("listaCobros")) cargarPedidosMesero();

  if(document.getElementById("panelNoti").style.display === "block"){
  cargarNotificaciones();
}
});


setInterval(()=>{
  if(document.getElementById("lista")){
    cargarPedidos();
  }
}, 6000);

</script>
