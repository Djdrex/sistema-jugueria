<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sistema PRO</title>
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <main>
    <section id="loginDiv">
      <h2>Login</h2>
      <label>Usuario <input id="user" autocomplete="username"></label><br><br>
      <label>Contraseña <input id="pass" type="password" autocomplete="current-password"></label><br><br>
      <button type="button" onclick="login()">Entrar</button>
    </section>
    <section id="app" hidden>
      <h2 id="info"></h2>
      <button type="button" onclick="logout()">Cerrar sesión</button>
      <nav id="tabs" aria-label="Módulos"></nav>
      <section id="contenido" aria-live="polite"></section>
    </section>
  </main>
  <aside id="notificaciones">
    <button type="button" onclick="toggleNotificaciones()">Notificaciones <span id="contadorNoti"></span></button>
    <div id="panelNoti" hidden>
      <button type="button" onclick="limpiarNotificaciones()">Limpiar todo</button>
    </div>
  </aside>
  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/pedidos.js"></script>
  <script src="/js/barra.js"></script>
  <script src="/js/inventario.js"></script>
  <script src="/js/notificaciones.js"></script>
  <script src="/js/reportes.js"></script>
  <script src="/js/usuarios.js"></script>
  <script src="/js/tabs.js"></script>
  <script src="/js/sockets.js"></script>
</body>
</html>
