<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7f5">
  <title>Juguería · Gestión</title>
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <main>
    <section id="loginDiv">
      <p class="eyebrow">Gestión de juguería</p>
      <h2>Bienvenido</h2>
      <p style="color:var(--muted)">Inicia sesión para continuar al espacio de trabajo.</p>
      <label>Usuario <input id="user" autocomplete="username"></label>
      <label>Contraseña <input id="pass" type="password" autocomplete="current-password"></label>
      <button class="primary-button" type="button" onclick="login()">Iniciar sesión</button>
    </section>
    <section id="app" hidden>
      <div class="workspace">
        <aside class="sidebar" id="sidebar">
          <div class="app-brand"><span class="brand-mark" aria-hidden="true">J</span><div><h1>Juguería</h1><p>Gestión del negocio</p></div></div>
          <nav id="tabs" aria-label="Navegación principal"></nav>
          <div class="sidebar-footer"><span class="online-dot"></span> Sistema conectado</div>
        </aside>
        <div class="workspace-main">
          <header class="app-header">
            <button id="menuToggle" class="icon-button menu-toggle" type="button" onclick="alternarMenu()" aria-label="Contraer menú">☰</button>
            <div class="header-title"><span class="eyebrow">Espacio de trabajo</span><h2 id="pageTitle">Resumen</h2></div>
            <div class="app-actions"><h3 id="info"></h3><button id="themeToggle" type="button" onclick="alternarTema()" aria-label="Cambiar tema">Modo oscuro</button><button type="button" onclick="verPerfil()">Mi perfil</button><button class="logout-button" type="button" onclick="logout()">Cerrar sesión</button></div>
          </header>
          <section id="contenido" aria-live="polite"></section>
        </div>
      </div>
    </section>
  </main>
  <aside id="notificaciones">
    <button type="button" onclick="toggleNotificaciones()">Notificaciones <span id="contadorNoti"></span></button>
    <div id="panelNoti" hidden>
      <button type="button" onclick="limpiarNotificaciones()">Limpiar todo</button>
    </div>
  </aside>
  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/pedidos.js"></script>
  <script src="/js/barra.js"></script>
  <script src="/js/inventario.js"></script>
  <script src="/js/insumos.js"></script>
  <script src="/js/notificaciones.js"></script>
  <script src="/js/reportes.js"></script>
  <script src="/js/usuarios.js"></script>
  <script src="/js/trabajadores.js"></script>
  <script src="/js/gastos.js"></script>
  <script src="/js/pagosPersonal.js"></script>
  <script src="/js/tabs.js"></script>
  <script src="/js/sockets.js"></script>
</body>
</html>
